<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Health Alpha Select - Professional Quote</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root { --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%); --accent-color: #764ba2; --border-color: #e2e8f0; }
        body { margin: 0; background: #f0f4f8; font-family: 'Segoe UI', sans-serif; padding-bottom: 40px; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        .card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--border-color); }
        .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
        .col-6 { grid-column: span 6; } .col-12 { grid-column: span 12; }
        .btn { padding: 12px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: 700; width: 100%; margin-top: 10px; }
        .btn-green { background: #10b981; color: white; }

        /* PDF STYLING */
        #pdf-overlay-root { display: none; position: absolute; left: -9999px; }
        .pdf-export-wrapper { width: 794px; background: white; }
        .pdf-cover-page { width: 794px; height: 1123px; overflow: hidden; }
        .pdf-cover-page img { width: 100%; height: 100%; object-fit: contain; }
        .pdf-page-container { width: 794px; height: 1123px; background-image: url('alphabackground.png'); background-size: cover; padding: 40px; box-sizing: border-box; }
        .pdf-content-wrapper { background: rgba(255, 255, 255, 0.92); padding: 20px; border-radius: 12px; height: 100%; }
        
        .pdf-sec-title { font-size: 10px; font-weight: 800; text-transform: uppercase; background: #f1f5f9; padding: 4px 8px; border-left: 4px solid #764ba2; margin: 15px 0 10px 0; }
        .pdf-tier-table { width: 100%; border-collapse: separate; border-spacing: 4px; margin-bottom: 15px; }
        .pdf-tier-table td { border: 1px solid #764ba2; padding: 6px; text-align: center; font-size: 9px; }
        .si-col { background: #f1f5f9; font-weight: 800; }
        .tier-prem { font-size: 12px; font-weight: 900; color: #764ba2; }
        .pdf-cols-wrapper { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .pdf-col { border: 1px solid #e2e8f0; padding: 8px; font-size: 8px; }
        .pdf-col-h { font-weight: 800; color: #764ba2; text-align: center; border-bottom: 1px solid #e2e8f0; margin-bottom: 5px; }
        .pdf-row-item { display: flex; justify-content: space-between; border-bottom: 1px dashed #f1f5f9; padding: 2px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h3>Health Alpha Quote Generator</h3>
            <div id="inputs"><!-- Form fields remain same as your original --></div>
            <button id="pdfBtn" class="btn btn-green">Download Professional PDF</button>
        </div>
    </div>
    <div id="pdf-overlay-root"></div>

    <script>
        // Data and existing calculation functions...
        const SI_LABELS_ORDER = ["5 Lac", "7.5 Lac", "10 Lac", "12.5 Lac", "15 Lac", "20 Lac", "25 Lac", "30 Lac", "35 Lac", "50 Lac", "75 Lac", "1Cr"];
        const SI_LABEL_TO_VALUE = { "5 Lac": 500000, "7.5 Lac": 750000, "10 Lac": 1000000, "12.5 Lac": 1250000, "15 Lac": 1500000, "20 Lac": 2000000, "25 Lac": 2500000, "30 Lac": 3000000, "35 Lac": 3500000, "50 Lac": 5000000, "75 Lac": 7500000, "1Cr": 10000000 };

        // [PASTE YOUR EXISTING CALCULATION FUNCTIONS HERE: BASE_RATES, calculatePremiumFor(), etc.]

        async function generatePDFBlob(customerName, si, policyType, combination, zone, tenure, membersStr) {
            const baseSiLabel = document.getElementById('sumInsured').value;
            const baseSiIdx = SI_LABELS_ORDER.indexOf(baseSiLabel);
            
            let targetSIs = [{ label: baseSiLabel, desc: "Selected" }];
            if (baseSiIdx + 1 < SI_LABELS_ORDER.length) targetSIs.push({ label: SI_LABELS_ORDER[baseSiIdx + 1], desc: "1 Level Up" });
            if (baseSiIdx + 2 < SI_LABELS_ORDER.length) targetSIs.push({ label: SI_LABELS_ORDER[baseSiIdx + 2], desc: "2 Levels Up" });

            let tierRowsHTML = targetSIs.map(siObj => {
                const premiumData = calculatePremiumFor(siObj.label);
                let cells = premiumData.map(item => `<td><div class="tier-prem">₹ ${item.prem.toLocaleString('en-IN')}</div>${item.save > 10 ? '<div class="tier-save" style="color:green; font-size:8px;">SAVE '+item.save+'%</div>' : ''}</td>`).join('');
                return `<tr><td class="si-col">${siObj.label}<span class="si-sub">${siObj.desc}</span></td>${cells}</tr>`;
            }).join('');

            document.getElementById('pdf-overlay-root').innerHTML = `
                <div class="pdf-export-wrapper" id="pdf-export-wrapper">
                    <div class="pdf-cover-page"><img src="alphacoverpage.png" alt="Cover"></div>
                    <div class="html2pdf__page-break"></div>
                    <div class="pdf-page-container">
                        <div class="pdf-content-wrapper">
                            <div class="pdf-header-row"><div class="pdf-title-main">Health Alpha Select</div></div>
                            <div class="pdf-sec-title">Premium Multi-Tier Summary</div>
                            <table class="pdf-tier-table">
                                <thead><tr><th>Sum Insured</th><th>1 Year</th><th>2 Year</th><th>3 Year</th><th>4 Year</th><th>5 Year</th></tr></thead>
                                <tbody>${tierRowsHTML}</tbody>
                            </table>
                            <div class="pdf-cols-wrapper"><!-- Inject your Modifiers/Optionals/Discounts HTML here --></div>
                        </div>
                    </div>
                </div>
            `;
            
            const opt = {
                margin: 0,
                filename: `Health_Alpha_Quote_${customerName}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'px', format: [794, 1123], orientation: 'portrait' } 
            };
            return await html2pdf().set(opt).from(document.getElementById('pdf-export-wrapper')).output('blob');
        }

        document.getElementById('pdfBtn').addEventListener('click', async () => {
            const blob = await generatePDFBlob(...); // Pass your form values
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'Quote.pdf'; a.click();
        });
    </script>
</body>
</html>
